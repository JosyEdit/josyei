name: Flux RSS, sitemap et liste des articles

on:
  push:
    branches: [main]
    paths:
      - "actualites/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: flux-et-sitemap
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # dates de premier commit des articles

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer feed.xml, sitemaps et liste des articles
        run: python scripts/build_feeds.py

      - name: Commit si quelque chose a changé
        id: commit
        run: |
          if git diff --quiet; then
            echo "Rien à mettre à jour."
            echo "pousse=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A feed.xml sitemap.xml news-sitemap.xml actualites/index.html
            git commit -m "Mise à jour flux, sitemap et liste des articles [skip ci]"
            git push
            echo "pousse=true" >> "$GITHUB_OUTPUT"
          fi

      # Un push fait avec GITHUB_TOKEN peut ne pas déclencher la publication Pages : on la demande explicitement.
      - name: Relancer la publication GitHub Pages
        if: steps.commit.outputs.pousse == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/JosyEdit/josyei/pages/builds
