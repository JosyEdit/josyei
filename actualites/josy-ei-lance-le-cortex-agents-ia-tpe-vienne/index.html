<script>
(function(){
  var b=document.querySelector('.jx .burger'), d=document.getElementById('jx-drawer');
  
  var here=location.pathname;
  document.querySelectorAll('.jx .menu a, .jx .drawer a').forEach(function(a){if(a.getAttribute('href')===here)a.setAttribute('aria-current','page');});
  var els=document.querySelectorAll('.jx .rv');
  if('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target);}});},{rootMargin:'0px 0px -10% 0px'});
    els.forEach(function(el){io.observe(el);});
  } else { els.forEach(function(el){el.classList.add('on');}); }
  // Formulaire natif (page Contact) : après un envoi réussi, page de remerciement
  document.querySelectorAll('.form-natif .validate-message').forEach(function(v){
    new MutationObserver(function(){
      if(v.textContent.trim() && /rgb\(0, ?179, ?65\)|#00b341/i.test(v.style.color)) location.href='/merci/';
    }).observe(v,{childList:true,characterData:true,subtree:true,attributes:true});
  });
  // Formulaire de demande d'audit : prépare un email, rien n'est envoyé sans le visiteur
  var f=document.getElementById('jx-audit');
  if(f){
    var m=f.querySelector('.msg');
    f.addEventListener('submit',function(ev){
      ev.preventDefault();
      var g=function(n){return (f[n]&&f[n].value||'').trim();};
      if(!g('entreprise')){m.textContent='Indiquez le nom de votre entreprise.';f.entreprise.focus();return;}
      if(!f.email.checkValidity()||!g('email')){m.textContent='Indiquez un email valide.';f.email.focus();return;}
      if(!f.rgpd.checked){m.textContent='Cochez la case pour accepter la politique de confidentialité.';f.rgpd.focus();return;}
      var body='Bonjour,\n\nJe souhaite un audit offert.\n\nEntreprise : '+g('entreprise')+'\nActivité et ville : '+g('activite')+'\nSite web ou fiche Google : '+g('site')+'\nEmail : '+g('email')+'\n\nMon besoin :\n'+g('besoin')+'\n\nDeux créneaux qui me conviennent :\n1. \n2. \n\nJ’accepte la politique de confidentialité (https://josyei.com/politique-de-confidentialite/).\n';
      window.location.assign('/contact/');
      m.textContent='Votre messagerie s’ouvre : ajoutez deux créneaux puis envoyez l’email.';
    });
  }
})();
